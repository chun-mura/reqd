name: validate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate plugin manifest JSON
        run: |
          jq -e . .claude-plugin/plugin.json > /dev/null
          jq -e . .claude-plugin/marketplace.json > /dev/null

      # Operating rule 3: every asset-changing commit ships its release metadata
      - name: Require release metadata in every commands/skills commit
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="origin/${{ github.base_ref }}"
            commits=$(git rev-list --reverse "$base"..HEAD)
          elif [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ] \
            && git cat-file -e "${{ github.event.before }}" 2>/dev/null; then
            base="${{ github.event.before }}"
            commits=$(git rev-list --reverse "$base"..HEAD)
          else
            echo "No base commit to diff against; checking the complete history"
            commits=$(git rev-list --reverse HEAD)
          fi

          asset_commits=0
          for commit in $commits; do
            parent="${commit}^"
            root_commit=false
            if git cat-file -e "$parent" 2>/dev/null; then
              changed=$(git diff --name-only "$parent" "$commit")
            else
              root_commit=true
              changed=$(git diff-tree --root --no-commit-id --name-only -r "$commit")
            fi

            if ! echo "$changed" | grep -qE '^(commands/|skills/)'; then
              continue
            fi
            asset_commits=$((asset_commits + 1))

            missing=""
            for required in README.md CHANGELOG.md .claude-plugin/plugin.json; do
              echo "$changed" | grep -qx "$required" || missing="$missing $required"
            done
            if [ -n "$missing" ]; then
              echo "Asset commit $commit is missing:$missing (operating rule 3)" >&2
              exit 1
            fi

            head_version=$(git show "${commit}:.claude-plugin/plugin.json" | jq -er '.version')
            version_pattern='^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'
            if ! printf '%s\n' "$head_version" | grep -qE "$version_pattern"; then
              echo "Asset commit $commit must use X.Y.Z SemVer: $head_version" >&2
              exit 1
            fi
            changelog_version=$(git show "${commit}:CHANGELOG.md" | sed -nE 's/^## ([0-9]+\.[0-9]+\.[0-9]+) .*/\1/p' | head -1)
            if [ "$changelog_version" != "$head_version" ]; then
              echo "Asset commit $commit has manifest version $head_version but latest CHANGELOG version $changelog_version" >&2
              exit 1
            fi
            if ! git show --format= "$commit" -- CHANGELOG.md | grep -q "^+## $head_version "; then
              echo "Asset commit $commit does not add CHANGELOG heading $head_version" >&2
              exit 1
            fi

            # README row-level enforcement starts with the v0.5.4 policy migration.
            # Surviving assets must touch their index row; deleted assets must drop it.
            head_parts=$(printf '%s' "$head_version" | jq -R 'split(".") | map(tonumber)')
            if jq -en --argjson head "$head_parts" '$head >= [0,5,4]' > /dev/null; then
              readme_diff=$(git show --format= "$commit" -- README.md)
              check_row() {
                if [ "$2" = true ]; then
                  if ! printf '%s\n' "$readme_diff" | grep -Fq -- "+| \`$1\`"; then
                    echo "Asset commit $commit does not update README index row for $1" >&2
                    exit 1
                  fi
                else
                  if ! printf '%s\n' "$readme_diff" | grep -Fq -- "-| \`$1\`"; then
                    echo "Asset commit $commit removes $1 but does not delete its README index row" >&2
                    exit 1
                  fi
                  if printf '%s\n' "$readme_diff" | grep -Fq -- "+| \`$1\`"; then
                    echo "Asset commit $commit removes $1 but README still adds an index row for it" >&2
                    exit 1
                  fi
                fi
              }
              for path in $(echo "$changed" | grep -E '^commands/[^/]+\.md$' | sort -u); do
                name="${path#commands/}"
                if git cat-file -e "${commit}:${path}" 2>/dev/null; then exists=true; else exists=false; fi
                check_row "/reqd:${name%.md}" "$exists"
              done
              for skill in $(echo "$changed" | sed -nE 's#^skills/([^/]+)/.*#\1#p' | sort -u); do
                if git cat-file -e "${commit}:skills/${skill}/SKILL.md" 2>/dev/null; then exists=true; else exists=false; fi
                check_row "$skill" "$exists"
              done
            fi
            if [ "$root_commit" = true ]; then
              echo "OK: root asset commit $commit includes release metadata and initial version $head_version"
            else
              base_version=$(git show "${parent}:.claude-plugin/plugin.json" | jq -er '.version')
              if ! printf '%s\n' "$base_version" | grep -qE "$version_pattern"; then
                echo "Parent of asset commit $commit has invalid X.Y.Z SemVer: $base_version" >&2
                exit 1
              fi
              base_parts=$(printf '%s' "$base_version" | jq -R 'split(".") | map(tonumber)')
              if jq -en --argjson base "$base_parts" --argjson head "$head_parts" '$head <= $base' > /dev/null; then
                echo "Asset commit $commit did not increase plugin version: $base_version -> $head_version (operating rule 3)" >&2
                exit 1
              fi
              echo "OK: asset commit $commit includes release metadata and version $base_version -> $head_version"
            fi
          done

          if [ "$asset_commits" -eq 0 ]; then
            echo "No asset-changing commits; release metadata not required"
          fi
